<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>告警</title><style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: #F2F5F4; width: 360px;
         font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
         color: #1B2A26; font-size: 17.0px; }
  .screen { width: 360px; min-height: 780px; display: flex; flex-direction: column; }
  .topbar { background: #FFFFFF; padding: 8px 16px; display: flex;
             align-items: center; gap: 8px; }
  .topbar .name { flex: 1; font-weight: 500; max-width: 200px; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 13.0px; color: #0E7C66;
           background: #F2F5F4; padding: 3px 8px; border-radius: 12.0px; }
  .body { flex: 1; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12.0px; }
  .card { background: #FFFFFF; border-radius: 12.0px; padding: 16.0px; }
  .section { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 -4px; }
  .section .t { font-size: 19.0px; font-weight: 500; }
  .section .n { font-size: 13.0px; color: #93A19C; }
  .row { display: flex; gap: 8px; align-items: center; }
  .tile { flex: 1; background: #FFFFFF; border-radius: 12.0px;
           padding: 10px; text-align: center; }
  .tile .v { font-size: 22.0px; font-weight: bold; }
  .tile .u { font-size: 14.0px; color: #5C6B66; }
  .tile .l { font-size: 13.0px; color: #93A19C; margin-top: 2px; }
  .kv { display: flex; justify-content: space-between; font-size: 14.0px; padding: 3px 0; }
  .kv .k { color: #5C6B66; }
  .hr { height: 1px; background: #E3E9E7; margin: 8px 0; }
  .hint { font-size: 13.0px; color: #93A19C; }
  .foot { text-align: center; font-size: 13.0px; color: #93A19C;
           padding: 8px 0 14px; }
  .tabbar { display: flex; background: #FFFFFF; border-top: 1px solid #E3E9E7;
             height: 64px; align-items: center; }
  .tab { flex: 1; text-align: center; font-size: 13.0px; color: #93A19C; position: relative; }
  .tab.active { color: #0E7C66; font-weight: 500; }
  .tab .ic { font-size: 22px; display: block; line-height: 26px; }
  .badge { position: absolute; top: -2px; right: 24px; background: #D64545; color: #fff;
            font-size: 10px; border-radius: 8px; padding: 0 4px; line-height: 16px; }
  .pill { display: inline-block; font-size: 13.0px; padding: 2px 8px; border-radius: 10px; }
  .lvl0 { color: #fff; background: #2E9E5B; }
  .lvl1 { color: #fff; background: #E6A23C; }
  .lvl2 { color: #fff; background: #D64545; }
  .lvloff { color: #fff; background: #9AA5A1; }
  .banner { border-radius: 12.0px; padding: 16.0px; color: #fff;
             display: flex; gap: 10px; align-items: center; }
  .btn { height: 48.0px; border-radius: 8.0px; background: #0E7C66;
          color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; }
  .btn.plain { background: #FFFFFF; color: #0E7C66;
                border: 1px solid #0E7C66; }
  .input { height: 48.0px; border-radius: 8.0px; background: #F2F5F4;
            display: flex; align-items: center; padding: 0 12px; color: #1B2A26; }
  .seg { display: flex; gap: 8px; }
  .seg div { flex: 1; height: 36px; border-radius: 8.0px; background: #F2F5F4;
              color: #5C6B66; display: flex; align-items: center; justify-content: center;
              font-size: 14.0px; }
  .seg div.on { background: #0E7C66; color: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 96px; padding-top: 6px; }
  .bars i { flex: 1; background: #0E7C66; opacity: .85; border-radius: 2px 2px 0 0; display: block; }
  .alertrow { display: flex; gap: 10px; align-items: flex-start; }
  .alertrow .ttl { font-size: 17.0px; font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .stepper .op { width: 34px; height: 34px; border-radius: 17px; background: #F2F5F4;
                  color: #0E7C66; display: flex; align-items: center; justify-content: center; }
  .stepper .val { min-width: 76px; text-align: center; font-weight: 500; }
  .swatch { position: absolute; left: 0; top: 0; }
</style></head>
<body><div class="screen">
  <div class="topbar">
    <span class="name">客厅网关 M0</span>
    <span class="chip">Mock 离线演示</span>
  </div>
  <div class="body">
      <div class="row" style="align-items:baseline">
        <span style="font-size:22.0px;font-weight:bold;flex:1">告警</span>
        <span class="hint">共 4 条</span>
      </div>
      <div class="seg"><div class="on">全部</div><div>待处置</div><div>已读</div><div>已处置</div></div>
      
        <div class="card">
          <div class="alertrow">
            <span class="pill lvl2">L2</span>
            <div style="flex:1">
              <div class="row"><span class="ttl">跌倒</span>
                <span style="margin-left:auto;font-size:14.0px;color:#D64545">待处置</span></div>
              <div class="hint" style="margin:2px 0">卧室检测到跌倒</div>
              <div class="hint">3 分钟前　重推 2 次 · 下次 21:11</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="alertrow">
            <span class="pill lvl1">L1</span>
            <div style="flex:1">
              <div class="row"><span class="ttl">燃气</span>
                <span style="margin-left:auto;font-size:14.0px;color:#D64545">待处置</span></div>
              <div class="hint" style="margin:2px 0">厨房燃气浓度偏高</div>
              <div class="hint">40 分钟前　设备侧已恢复（30 分钟前）</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="alertrow">
            <span class="pill lvl1">L1</span>
            <div style="flex:1">
              <div class="row"><span class="ttl">节点离线</span>
                <span style="margin-left:auto;font-size:14.0px;color:#D64545">已读待处置</span></div>
              <div class="hint" style="margin:2px 0">节点 M4 已离线</div>
              <div class="hint">1 小时前　打开详情页已停止重推</div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="alertrow">
            <span class="pill lvl1">L1</span>
            <div style="flex:1">
              <div class="row"><span class="ttl">长时间无活动</span>
                <span style="margin-left:auto;font-size:14.0px;color:#2E9E5B">已处置</span></div>
              <div class="hint" style="margin:2px 0">30 分钟未检测到活动</div>
              <div class="hint">3 小时前　已上门查看</div>
            </div>
          </div>
        </div>
      <div class="foot">GET /api/alerts?device_id=1&amp;status=all&amp;limit=50　每 10 s 刷新</div>
    </div>
  <div class="tabbar"><div class="tab"><span class="ic">🏠</span>首页</div><div class="tab active"><span class="ic">🔔</span>告警<span class="badge">3</span></div><div class="tab"><span class="ic">📊</span>报表</div><div class="tab"><span class="ic">⚙️</span>设置</div></div>
</div></body></html>
