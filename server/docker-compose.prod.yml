# 生产用 compose（t41）。⭐ 与 docker-compose.yml（开发/测试）**共用项目名 hmprogram**：
# 两者用同一套容器名与数据卷，切换时必须先 down 再起，不要把两份同时跑。
#
# 与开发口径的三处关键差异（验收要求）：
#   1) db **不发布任何宿主机端口** —— MySQL 只在容器网络内可达（api 走 db:3306），公网碰不到；
#   2) 只有 nginx 反代监听公网端口（IoTDA 规则引擎要回调到它），api 只绑 127.0.0.1；
#   3) 每个服务都有内存上限 + 日志轮转（部署机内存小：别让 MySQL 把机器吃干）。
#
# 用法（在 server/ 目录下，先把 .env.example 复制成 .env 并填真实值，否则 APP_ENV=prod 会拒绝启动）：
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api
name: hmprogram

services:
  db:
    image: mysql:8.0
    container_name: hmprogram-server-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00          # 契约 §0.2：时间列一律 UTC
      - --max-connections=64                # 单机演示规模，防止把内存耗在连接上
      - --innodb-buffer-pool-size=256M      # 默认 128M 偏小、再大就要吃内存
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-eldercare}
      MYSQL_USER: ${DB_USER:-eldercare}
      MYSQL_PASSWORD: ${DB_PASSWORD:?生产必须设置 DB_PASSWORD}
      TZ: UTC
    # ⚠ 这里**故意不写 ports:**。开发用的 docker-compose.yml 才把 3306 绑到 127.0.0.1。
    volumes:
      - hmprogram-server-db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      # t67/F-02：`mysqladmin ping` 只要服务端有响应就返回 0（口令错也判 healthy），会把
      # 「db healthy + api 反复 1045」的排查顺序带偏。这里改成带鉴权的探测，两个账号都要能 SELECT 1：
      #   - root（$MYSQL_ROOT_PASSWORD）：运维用（ALTER USER / root 路径的 mysqldump）；
      #   - $MYSQL_USER/$MYSQL_PASSWORD（= .env 的 DB_USER/DB_PASSWORD）：api 实际连库用的账号。
      #     只探 root 挡不住最常见的那个坑——「数据卷里 eldercare 的口令与 .env 的 DB_PASSWORD 不一致」。
      # 于是「db healthy」等价于「api 连得上」：口令不对 → db unhealthy → api 不会启动（depends_on）。
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' --silent && mysql -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m            # 实测稳态 ≈412 MiB（innodb-buffer-pool 256M + 连接/缓冲），留一半余量
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmprogram-server-api:latest
    container_name: hmprogram-server-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 默认就是 prod：在部署机上忘了写 APP_ENV 也不会误用 dev 口径
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_VERSION: ${SERVER_VERSION:-1.0.0}
      CLOCK_SOURCE: ${CLOCK_SOURCE:-server}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-eldercare}
      DB_USER: ${DB_USER:-eldercare}
      DB_PASSWORD: ${DB_PASSWORD:?生产必须设置 DB_PASSWORD}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-1}
      # 占位符会让进程拒绝启动（app/config.py）：这两个值必须随机生成后写进 .env
      JWT_SECRET: ${JWT_SECRET:?生产必须设置随机 JWT_SECRET}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?生产必须设置随机 WEBHOOK_TOKEN}
      IOTDA_DISPATCH_MODE: ${IOTDA_DISPATCH_MODE:-mock}
      IOTDA_ENDPOINT: ${IOTDA_ENDPOINT:-}
      IOTDA_PROJECT_ID: ${IOTDA_PROJECT_ID:-}
      IOTDA_APP_ID: ${IOTDA_APP_ID:-}
      IOTDA_APP_SECRET: ${IOTDA_APP_SECRET:-}
      IOTDA_IAM_USER: ${IOTDA_IAM_USER:-}
      IOTDA_IAM_PASSWORD: ${IOTDA_IAM_PASSWORD:-}
      IOTDA_IAM_DOMAIN: ${IOTDA_IAM_DOMAIN:-}
      PUSH_MODE: ${PUSH_MODE:-mock}
      PUSH_CLIENT_ID: ${PUSH_CLIENT_ID:-}
      PUSH_CLIENT_SECRET: ${PUSH_CLIENT_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    # 只绑本机：公网入口统一走下面的 nginx，服务器上也能直接 curl 127.0.0.1:3000 排障
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: hmprogram-server-proxy
    depends_on:
      - api
    # 唯一对外端口：IoTDA 规则引擎回调 https://<公网IP>:<端口>/api/iotda/webhook?token=...
    # 若 80 已被系统自带的 web 服务占用，改 .env 的 PUBLIC_HTTP_PORT（如 8080），
    # 并同步在云安全组放通该端口。
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    # 探活走反代自己，能同时验证「nginx 起了」和「它转得到 api」
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    restart: unless-stopped

volumes:
  hmprogram-server-db-data:
