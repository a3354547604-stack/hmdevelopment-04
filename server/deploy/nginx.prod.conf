# 生产反代（docker-compose.prod.yml 的 proxy 服务用这份，不是 deploy/nginx.conf）
#
# 职责：唯一对外入口。IoTDA 规则引擎的 webhook 与 App 的 REST 都从 80 进来，
#       转到容器网络内的 api:3000（api 自己只绑 127.0.0.1，公网直接打不到）。
#
# 生产差异（相对开发用的 nginx.conf）：
#   · server_tokens off            —— 不回显 nginx 版本号
#   · client_max_body_size 1m      —— §4.1 消息按 ≤4 KB 设计，1 MB 给足余量又不做「上传入口」
#   · /api/health 不记访问日志      —— 健康检查太频繁，避免日志被刷满（磁盘有限）
#   · location / 直接 404          —— 不对外暴露任何非 /api 内容（不放静态目录、不放 /docs）
#
# 需要 HTTPS 时：域名+证书就绪后，把 443 的 server 块打开（见文件末尾注释），
# 并把 IoTDA 转发 URL 改成 https://<域名>/api/iotda/webhook?token=...
server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 健康检查：不打访问日志，只看状态码
    location = /api/health {
        access_log off;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # webhook 入口（IoTDA 规则引擎 → 本机）与 REST 走同一后端
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;      # webhook 处理很快；30 s 足够且不会长期占住连接
        proxy_send_timeout 30s;
    }

    # 其它路径一律 404：不对外暴露任何非 /api 内容（不放静态目录、不放 /docs）
    location / {
        return 404;
    }
}

