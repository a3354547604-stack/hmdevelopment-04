# 可选反代（profile=proxy）：契约 §0.8 的 Nginx → 127.0.0.1:3000
# 只做转发与基础超时，TLS 由生产环境在 443 上终止（本文件是本地演示口径）。
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;          # 契约 §4.1 单条消息按 ≤4 KB 设计，这里给足余量

    # webhook 入口（IoTDA 规则引擎 → 本机）与 REST 走同一后端
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
